name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages: it publishes as the Pages environment and
# proves who it is with an OIDC token rather than a stored secret.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds dist/: the page, the two bundles and sql.js's .wasm.
      - run: npm run build:pages

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
