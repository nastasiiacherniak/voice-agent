<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Record fixture audio</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .recorder { max-width: 820px; margin: 0 auto; padding: 44px 24px 64px; }
      .recorder-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 8px; }
      .recorder-head h1 { margin: 0; font-family: var(--serif); font-size: 32px; font-weight: 400; letter-spacing: -0.015em; }
      .recorder-lede { margin: 10px 0 28px; color: var(--muted); font-size: 14px; max-width: 60ch; }
      .recorder-lede code { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; font-size: 12.5px; }

      .clips { display: flex; flex-direction: column; gap: 10px; }
      .clip {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 14px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        box-shadow: var(--shadow-sm);
      }
      .clip .say { font-size: 14px; }
      .clip .meta { color: var(--faint); font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .clip button {
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 999px;
        padding: 7px 14px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
      }
      .clip button:hover { border-color: var(--line-strong); color: var(--text); }
      .clip button.rec { border-color: #f2c4bd; color: var(--bad); background: #fdecea; }
      .clip.recording { border-color: var(--bad); }
      .clip.saved { border-color: #bfe3c9; background: var(--good-soft); }
      @media (max-width: 720px) { .clip { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="recorder">
      <div class="recorder-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">AI&nbsp;Assistant</span>
        </div>
        <a class="ghost" href="/" style="text-decoration: none">&larr; back to the desk</a>
      </div>

      <h1>Record fixture audio</h1>
      <p class="recorder-lede">
        Replaces the synthesised clips in <code>tests/fixtures/audio/</code> with your own voice.
        The expected outcomes do not change &mdash; only the recording does.
      </p>

      <div id="status" class="notice" hidden></div>
      <div id="clips" class="clips"></div>
    </div>

    <script src="recorder.js"></script>
  </body>
</html>
